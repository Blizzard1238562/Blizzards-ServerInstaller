name: Release

# Pushing a version tag (e.g. v1.2.0 or v1.2.0-alpha.1) builds the installer
# natively on Windows, Linux and macOS (PyInstaller cannot cross-compile) and
# publishes a GitHub Release with all three binaries attached. Tags
# containing -alpha/-beta/-rc are published as prereleases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            separator: ";"
            asset_name: Blizzards-Server-Installer-windows-x64.exe
          - os: ubuntu-latest
            separator: ":"
            asset_name: Blizzards-Server-Installer-linux-x64
          - os: macos-latest
            separator: ":"
            asset_name: Blizzards-Server-Installer-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --onefile --name "${{ matrix.asset_name }}" --add-data "plugins.json${{ matrix.separator }}." --console installer.py
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh needs a git checkout to resolve the tag it is releasing.
      - uses: actions/checkout@v4
      - name: Collect built binaries
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(ls assets/* 2>/dev/null)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No binaries found in the assets folder"
            exit 1
          fi
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" $prerelease --generate-notes
