name: Release

# Pushing a version tag (e.g. v1.2.0) builds the Windows exe and publishes a
# GitHub Release with it attached. See the README "Releases" section.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build exe and publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --onefile --name Blizzards-Server-Installer --add-data 'plugins.json;.' --console installer.py
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/Blizzards-Server-Installer.exe" --generate-notes
