name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install requests ruamel.yaml
      - name: Run test suite
        run: python test_installer.py

  build-exe:
    name: Build exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --onefile --name Blizzards-Server-Installer --add-data 'plugins.json;.' --console installer.py
      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blizzards-Server-Installer-exe
          path: dist/Blizzards-Server-Installer.exe
